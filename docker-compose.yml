services:
  sparrow:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LLM7_API_KEY: ${LLM7_API_KEY:-}
      OVH_AI_ENDPOINTS_ACCESS_TOKEN: ${OVH_AI_ENDPOINTS_ACCESS_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      SAMBANOVA_API_KEY: ${SAMBANOVA_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      KILO_API_KEY: ${KILO_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      AION_API_KEY: ${AION_API_KEY:-}
      MODELSCOPE_API_KEY: ${MODELSCOPE_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      CHUTES_API_KEY: ${CHUTES_API_KEY:-}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      BAI_API_KEY: ${BAI_API_KEY:-}
      MORPH_API_KEY: ${MORPH_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      FREE_AI_API_KEY: ${FREE_AI_API_KEY:-}
      SPARROW_PROXY_KEY: ${SPARROW_PROXY_KEY:-}
    volumes:
      - sparrow-data:/home/sparrow/.config/sparrow
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://sparrow:8080/v1
      OPENAI_API_KEY: ${SPARROW_PROXY_KEY:-anything}
      WEBUI_AUTH: "${WEBUI_AUTH:-true}"
    depends_on:
      sparrow:
        condition: service_healthy
    volumes:
      - open-webui:/app/backend/data
    restart: unless-stopped

volumes:
  sparrow-data:
  open-webui:
