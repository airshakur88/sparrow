name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Release metadata readiness
        run: python scripts/check_release_ready.py --skip-build
      - name: Proxy stress smoke
        run: python scripts/stress_proxy.py --profile ci
      - name: Type check focused helpers
        run: mypy --follow-imports=skip src/sparrow/routing_modes.py src/sparrow/catalog_validation.py src/sparrow/_version.py src/sparrow/readiness.py
      - name: Import smoke
        run: python -c "import sparrow; from sparrow import Pool, AsyncPool; print(sparrow.__version__, Pool, AsyncPool)"
      - name: Test
        run: |
          pytest --cov=sparrow --cov-branch --cov-report=term-missing --cov-report=json:.coverage.json
          python scripts/check_coverage.py .coverage.json
      - name: Wheel smoke
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          python -m venv /tmp/sparrow-wheel-smoke
          /tmp/sparrow-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/sparrow-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/sparrow-wheel-smoke/bin/python -c "import sparrow; from sparrow import Pool, AsyncPool; print(sparrow.__version__, Pool, AsyncPool)"
          /tmp/sparrow-wheel-smoke/bin/sparrow --version

  docker-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and smoke-test the container
        run: |
          set -euo pipefail
          image="sparrow:ci-${{ github.sha }}"
          container="sparrow-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          cleanup() {
            exit_code=$?
            set +e
            if test "$exit_code" -ne 0; then docker logs "$container"; fi
            docker rm --force "$container" >/dev/null 2>&1
            docker image rm "$image" >/dev/null 2>&1
            exit "$exit_code"
          }
          trap cleanup EXIT
          docker build --tag "$image" .
          docker run --rm --entrypoint python "$image" -c 'import os, sparrow; assert sparrow.__version__; assert os.getuid() != 0'
          docker run --rm "$image" --version
          docker run --detach --name "$container" --publish 127.0.0.1:18080:8080 "$image"
          for _attempt in $(seq 1 30); do
            if response=$(curl --fail --silent http://127.0.0.1:18080/healthz) && \
              python -c 'import json, sys; assert json.loads(sys.argv[1])["status"] == "ok"' "$response"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
