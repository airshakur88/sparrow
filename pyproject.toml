[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "sparrow"
version = "0.0.0"
description = "Free LLM gateway: 18 LLM providers, 157 enabled chat routes, 157 cataloged chat models; keyless start when available."
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "airshakur88" }]
keywords = [
    "anthropic",
    "claude",
    "llm",
    "free-llm",
    "openai",
    "openai-compatible",
    "gateway",
    "llm-gateway",
    "router",
    "free",
    "groq",
    "cerebras",
    "openrouter",
    "gemini",
    "speech-to-text",
    "transcription",
    "rate-limiting",
    "load-balancer",
    "failover",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/airshakur88/sparrow"
Repository = "https://github.com/airshakur88/sparrow"
Issues = "https://github.com/airshakur88/sparrow/issues"

[project.optional-dependencies]
yaml = ["pyyaml>=6.0,<7"]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0,<7",
    "ruff>=0.6",
    "twine==7.0.0",
]
security = [
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "zizmor==1.29.0",
]

[project.scripts]
sparrow = "sparrow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sparrow"]

[tool.hatch.build.targets.wheel.force-include]
"src/sparrow/providers.toml" = "sparrow/providers.toml"
"src/sparrow/capability_scores.json" = "sparrow/capability_scores.json"
"src/sparrow/task_evidence.json" = "sparrow/task_evidence.json"

[tool.hatch.build.targets.sdist.force-include]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
